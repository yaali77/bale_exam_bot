server {
    listen 80;
    server_name yourdomain.example.com;

    # برای دریافت گواهی Let's Encrypt (Certbot) و ریدایرکت به HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name yourdomain.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20M;

    # فایل‌های PDF/QR/Excel به صورت مستقیم و کش‌شده سرو می‌شوند
    location /storage/ {
        alias /app/storage/;
        add_header Cache-Control "public, max-age=3600";
    }

    # مسیرهای API و Webhook به بک‌اند FastAPI می‌روند
    location ~ ^/(api|webhook|verify|health|docs|openapi.json)/? {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # باقی مسیرها (رابط کاربری پنل مدیریت - React SPA)
    location / {
        proxy_pass http://admin-panel:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }
}
